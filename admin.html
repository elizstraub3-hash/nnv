<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Painel · NNV by Neneve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f4f2f1; --surface:#fff; --ink:#141410; --muted:#6f6a68;
      --line:rgba(17,17,17,.1); --brand:#d81f2a; --brand2:#a5121b;
      --radius:16px; --font:"Inter",system-ui,sans-serif; --display:"Poppins",var(--font);
      --shadow:0 12px 34px rgba(17,17,17,.07);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5}
    button{font-family:inherit}
    [hidden]{display:none !important}
    /* ===== LOGIN ===== */
    .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:radial-gradient(60% 60% at 50% 0%,rgba(216,31,42,.10),transparent 60%),var(--bg)}
    .login__box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:40px 32px;width:100%;max-width:390px;text-align:center;box-shadow:var(--shadow)}
    .logo{font-family:var(--display);font-weight:800;font-size:1.8rem;letter-spacing:-.02em}
    .logo span{color:var(--brand)}
    .login__box p{color:var(--muted);margin:6px 0 24px;font-size:.92rem}
    .field{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;font-size:1rem;font-family:var(--font);background:#fff;color:var(--ink)}
    .field:focus{outline:2px solid var(--brand);border-color:var(--brand)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;font-family:var(--display);font-weight:600;cursor:pointer;padding:11px 20px;font-size:.92rem;transition:.2s;white-space:nowrap}
    .btn--primary{background:var(--brand);color:#fff}
    .btn--primary:hover{background:var(--brand2)}
    .btn--dark{background:var(--ink);color:#fff}
    .btn--ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
    .btn--danger{background:#fff;border:1px solid var(--brand);color:var(--brand)}
    .btn--danger:hover{background:var(--brand);color:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .msg{font-size:.86rem;margin-top:12px;min-height:18px}
    .msg--err{color:var(--brand)} .msg--ok{color:#127a2e}
    /* ===== HEADER ===== */
    .top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 22px}
    .top .logo{color:#fff;font-size:1.25rem}
    .top .logo small{font-weight:500;font-family:var(--font);color:rgba(255,255,255,.6);font-size:.72rem;margin-left:6px}
    .top__actions{display:flex;gap:10px;align-items:center}
    .top .btn--ghost{color:#fff;border-color:rgba(255,255,255,.28)}
    .top .btn--ghost:hover{background:rgba(255,255,255,.1)}
    .wrap{max-width:960px;margin:0 auto;padding:22px 16px 90px}
    /* ===== STATS ===== */
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
    .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
    .stat b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1}
    .stat span{color:var(--muted);font-size:.82rem;margin-top:4px;display:block}
    .stat--out b{color:var(--brand)}
    /* ===== TOOLBAR ===== */
    .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .bar__left{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .bar h1{font-family:var(--display);font-size:1.5rem}
    .search{padding:11px 16px;border:1px solid var(--line);border-radius:999px;font-size:.92rem;font-family:var(--font);background:#fff;min-width:200px}
    .search:focus{outline:2px solid var(--brand);border-color:var(--brand)}
    .hint{background:#fff;border:1px dashed var(--brand);border-radius:14px;padding:18px;font-size:.92rem;color:var(--muted);margin-bottom:18px;text-align:center}
    .hint b{color:var(--ink)}
    /* ===== PRODUTO ===== */
    .prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px rgba(17,17,17,.03)}
    .prod__head{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer}
    .prod__head:hover{background:#faf9f8}
    .thumb{width:52px;height:64px;border-radius:10px;object-fit:cover;background:#eee;flex-shrink:0;border:1px solid var(--line)}
    .thumb--empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.3rem}
    .prod__info{flex:1;min-width:0}
    .prod__name{font-family:var(--display);font-weight:600;font-size:1.02rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .prod__sub{color:var(--muted);font-size:.82rem;margin-top:2px}
    .prod__price{font-family:var(--display);font-weight:700;font-size:1.02rem;white-space:nowrap}
    .pill{font-size:.66rem;font-weight:700;font-family:var(--display);padding:3px 9px;border-radius:999px;background:#eee;color:#666;white-space:nowrap}
    .pill--out{background:var(--brand);color:#fff}
    .pill--look{background:var(--ink);color:#fff}
    .chev{color:var(--muted);transition:transform .2s;font-size:1.1rem}
    .prod.open .chev{transform:rotate(180deg)}
    .prod__body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
    .prod.open .prod__body{display:block}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
    label.lbl{display:block;font-size:.76rem;color:var(--muted);font-weight:600;margin-bottom:5px}
    .full{grid-column:1 / -1}
    .chk{display:flex;align-items:center;gap:8px;font-size:.92rem;background:#faf9f8;border:1px solid var(--line);border-radius:10px;padding:11px 14px}
    .chk input{width:18px;height:18px;accent-color:var(--brand)}
    .colors{display:flex;flex-direction:column;gap:8px}
    .color-row{display:grid;grid-template-columns:1fr 44px 1fr 34px;gap:8px;align-items:center}
    .color-row input[type=color]{width:44px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:#fff}
    .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1rem;color:var(--brand)}
    .imgs{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
    .imgs figure{position:relative;width:78px;height:98px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
    .imgs img{width:100%;height:100%;object-fit:cover}
    .imgs figure button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:.9rem;line-height:1}
    .up{width:78px;height:98px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--muted);cursor:pointer}
    .up:hover{border-color:var(--brand);color:var(--brand)}
    .prod__foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
    .empty{text-align:center;color:var(--muted);padding:40px 0}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;z-index:60;pointer-events:none;box-shadow:var(--shadow)}
    .toast.show{opacity:1}
    @media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.search{min-width:0;flex:1}.bar__left{flex:1}}
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div class="login" id="loginView">
    <form class="login__box" id="loginForm">
      <div class="logo">NN<span>V</span></div>
      <p>Painel da loja · acesso restrito</p>
      <input type="password" id="pw" class="field" placeholder="Senha" autocomplete="current-password" required />
      <button class="btn btn--primary" style="width:100%;margin-top:14px" id="loginBtn" type="submit">Entrar</button>
      <p class="msg msg--err" id="loginMsg"></p>
    </form>
  </div>

  <!-- PAINEL -->
  <div id="panelView" hidden>
    <header class="top">
      <div class="logo">NN<span>V</span><small>Painel da loja</small></div>
      <div class="top__actions">
        <a href="/" target="_blank" class="btn btn--ghost">Ver loja ↗</a>
        <button class="btn btn--ghost" id="logoutBtn">Sair</button>
      </div>
    </header>
    <div class="wrap">
      <div class="stats" id="stats"></div>
      <div class="bar">
        <div class="bar__left">
          <h1>Produtos</h1>
          <input id="search" class="search" placeholder="🔍 Buscar produto..." />
        </div>
        <button class="btn btn--primary" id="addBtn">+ Novo produto</button>
      </div>
      <div id="seedHint" class="hint" hidden>
        <b>Nenhum produto no banco ainda.</b><br>
        Clique abaixo para importar os produtos que já estão no site:
        <div style="margin-top:12px"><button class="btn btn--dark" id="seedBtn">Importar produtos atuais</button></div>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
