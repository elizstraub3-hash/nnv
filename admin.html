<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Painel · NNV by Neneve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#f6f4f3; --surface:#fff; --ink:#141410; --muted:#6f6a68;
      --line:rgba(17,17,17,.12); --brand:#d81f2a; --brand2:#a5121b;
      --radius:14px; --font:"Inter",system-ui,sans-serif; --display:"Poppins",var(--font);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5}
    a{color:var(--brand)}
    /* Login */
    .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .login__box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:38px 30px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.08)}
    .logo{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.02em}
    .logo span{color:var(--brand)}
    .login__box p{color:var(--muted);margin:6px 0 22px;font-size:.92rem}
    .field{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;font-size:1rem;font-family:var(--font);background:#fff;color:var(--ink)}
    .field:focus{outline:2px solid var(--brand);border-color:var(--brand)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;font-family:var(--display);font-weight:600;cursor:pointer;padding:12px 22px;font-size:.95rem;transition:.2s}
    .btn--primary{background:var(--brand);color:#fff}
    .btn--primary:hover{background:var(--brand2)}
    .btn--dark{background:var(--ink);color:#fff}
    .btn--ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
    .btn--danger{background:#fff;border:1px solid var(--brand);color:var(--brand)}
    .btn--danger:hover{background:var(--brand);color:#fff}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .msg{font-size:.86rem;margin-top:12px;min-height:18px}
    .msg--err{color:var(--brand)}
    .msg--ok{color:#127a2e}
    /* Topbar */
    .top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
    .top .logo{color:#fff;font-size:1.2rem}
    .top .logo span{color:var(--brand)}
    .top__actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .wrap{max-width:900px;margin:0 auto;padding:20px 16px 80px}
    .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .bar h1{font-family:var(--display);font-size:1.4rem}
    .hint{background:#fff;border:1px dashed var(--brand);border-radius:12px;padding:14px 16px;font-size:.9rem;color:var(--muted);margin-bottom:18px}
    /* Card produto */
    .prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
    .prod__head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
    .prod__title{font-family:var(--display);font-weight:600;font-size:1.05rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .pill{font-size:.68rem;font-weight:700;font-family:var(--display);padding:3px 9px;border-radius:999px;background:#eee;color:#555}
    .pill--out{background:#4a4a4a;color:#fff}
    .prod__body{margin-top:14px;display:none}
    .prod.open .prod__body{display:block}
    .prod__body.always{display:block}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    label.lbl{display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin-bottom:5px}
    .full{grid-column:1 / -1}
    .chk{display:flex;align-items:center;gap:8px;font-size:.95rem}
    .chk input{width:18px;height:18px;accent-color:var(--brand)}
    /* cores */
    .colors{display:flex;flex-direction:column;gap:8px}
    .color-row{display:grid;grid-template-columns:1fr 44px 1fr 34px;gap:8px;align-items:center}
    .color-row input[type=color]{width:44px;height:40px;padding:2px;border:1px solid var(--line);border-radius:10px;background:#fff}
    .icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1rem;color:var(--brand)}
    /* imagens */
    .imgs{display:flex;flex-wrap:wrap;gap:10px}
    .imgs figure{position:relative;width:82px;height:104px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
    .imgs img{width:100%;height:100%;object-fit:cover}
    .imgs figure button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;font-size:.9rem;line-height:1}
    .up{width:82px;height:104px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--muted);cursor:pointer}
    .up:hover{border-color:var(--brand);color:var(--brand)}
    .prod__foot{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
    .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:.9rem;opacity:0;transition:.3s;z-index:50;pointer-events:none}
    .toast.show{opacity:1}
    @media(max-width:560px){.row{grid-template-columns:1fr}.color-row{grid-template-columns:1fr 44px 1fr 30px}}
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div class="login" id="loginView">
    <form class="login__box" id="loginForm">
      <div class="logo">NN<span>V</span></div>
      <p>Painel da loja · acesso restrito</p>
      <input type="password" id="pw" class="field" placeholder="Senha" autocomplete="current-password" required />
      <button class="btn btn--primary" style="width:100%;margin-top:14px" id="loginBtn" type="submit">Entrar</button>
      <p class="msg msg--err" id="loginMsg"></p>
    </form>
  </div>

  <!-- PAINEL -->
  <div id="panelView" hidden>
    <div class="top">
      <div class="logo">NN<span>V</span> · Painel</div>
      <div class="top__actions">
        <a href="/" target="_blank" class="btn btn--ghost" style="color:#fff;border-color:rgba(255,255,255,.3)">Ver loja</a>
        <button class="btn btn--ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" id="logoutBtn">Sair</button>
      </div>
    </div>
    <div class="wrap">
      <div class="bar">
        <h1>Produtos</h1>
        <button class="btn btn--primary" id="addBtn">+ Novo produto</button>
      </div>
      <div id="seedHint" class="hint" hidden>
        Nenhum produto no banco ainda. Clique para importar os produtos que já estão no site:
        <div style="margin-top:10px"><button class="btn btn--dark" id="seedBtn">Importar produtos atuais</button></div>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="admin-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
